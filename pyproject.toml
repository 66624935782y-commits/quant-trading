[project]
name = "quant-trading"
version = "0.1.0"
description = "A PAPER-only learning platform for market analysis and virtual trading"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "ccxt>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
